<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Formulário de E-mail e celular</h1>
    <form action="cadastro.php" method="get" autocomplete="on" >
        <p>
            <label for="iemail" >E-mail</label>
            <input name="email" id="iemail"  type="email" autocomplete="email" required>
        </p>
        <p>
            <label for="itel">Celular</label>
            <input type="tel" id="itel" name="tel" autocomplete="tel" required> 
        </p>

        <p>
            <input type="submit"> <input type="reset">
        </p>

    </form>


</body>
</html>
